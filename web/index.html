<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ResumeKit — Resume Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  /* ────────────────────────────────────────────────────────────────────
  /* ─────────────────────────────────────────────────────────────────
   *  Midnight & Bronze
   *  Deep navy ink on warm ivory paper, with a single restrained
   *  bronze-gold accent. Magazine-cover quietness; nothing decorative
   *  that doesn't earn its place.
   * ───────────────────────────────────────────────────────────────── */
  :root {
    --accent-h: 62;
    --accent: oklch(0.62 0.12 var(--accent-h));            /* burnished bronze */
    --accent-soft: oklch(0.62 0.12 var(--accent-h) / 0.13);
    --accent-tint: oklch(0.94 0.05 var(--accent-h));
    --accent-strong: oklch(0.52 0.13 var(--accent-h));     /* deep bronze */
    --accent-deep: oklch(0.40 0.10 var(--accent-h));       /* aged bronze */
    --accent-ink: oklch(0.18 0.03 250);                    /* navy on bronze */

    --bg: oklch(0.988 0.004 85);                           /* near-white, hint of warmth */
    --paper: oklch(0.995 0.003 85);
    --surface: oklch(1.000 0.000 0);
    --surface-2: oklch(0.972 0.006 80);
    --surface-3: oklch(0.942 0.010 80);

    --ink: oklch(0.20 0.045 255);                          /* deep navy */
    --ink-2: oklch(0.34 0.045 255);
    --muted: oklch(0.50 0.030 255);
    --faint: oklch(0.68 0.025 255);
    --border: oklch(0.90 0.012 75);
    --border-strong: oklch(0.82 0.018 75);
    --hairline: oklch(0.88 0.012 75);
    --ring: oklch(0.62 0.12 var(--accent-h) / 0.32);

    --shadow-xs: 0 1px 2px oklch(0.20 0.04 255 / 0.05);
    --shadow-sm: 0 1px 2px oklch(0.20 0.04 255 / 0.06), 0 1px 1px oklch(0.20 0.04 255 / 0.04);
    --shadow-md: 0 1px 2px oklch(0.20 0.04 255 / 0.05), 0 8px 24px -12px oklch(0.20 0.04 255 / 0.18);
    --shadow-lg: 0 14px 40px -18px oklch(0.20 0.04 255 / 0.28), 0 2px 6px oklch(0.20 0.04 255 / 0.06);

    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 12px;
    --radius-xl: 16px;

    --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-feature-settings: 'cv11', 'ss01', 'ss03';
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 14px;
    line-height: 1.55;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; }
  #root { min-height: 100vh; display: flex; flex-direction: column; }

  ::selection { background: var(--accent-soft); color: var(--ink); }
  button { font: inherit; color: inherit; }
  input, textarea, select { font: inherit; color: inherit; }

  /* ====== Utility: scrollbars ====== */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: padding-box; border: 2px solid transparent; }

  /* ====== Animations ====== */
  @keyframes rk-shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  @keyframes rk-spin { to { transform: rotate(360deg); } }
  @keyframes rk-pulse-ring {
    0% { box-shadow: 0 0 0 0 var(--accent-soft); }
    70% { box-shadow: 0 0 0 10px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @keyframes rk-slide-in {
    from { transform: translateY(3px); }
    to   { transform: translateY(0); }
  }

  /* gentle entrance without ever blocking visibility on stuck animations */
  .rk-fade-in { animation: rk-slide-in .22s ease both; }
  .rk-pop-in  { animation: rk-slide-in .18s cubic-bezier(.22,1.2,.36,1) both; }

  /* ====== Buttons ====== */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .08s ease, box-shadow .15s ease;
    line-height: 1;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
  .btn:active { transform: translateY(0.5px); }
  .btn[data-variant="primary"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .btn[data-variant="primary"]:hover { background: oklch(0.30 0.025 250); border-color: oklch(0.30 0.025 250); }
  .btn[data-variant="accent"] {
    background: oklch(0.72 0.12 var(--accent-h));
    color: var(--accent-ink);
    border-color: oklch(0.68 0.12 var(--accent-h));
    box-shadow: 0 1px 0 oklch(1 0 0 / .28) inset, 0 4px 12px -2px oklch(0.62 0.12 var(--accent-h) / 0.25);
  }
  .btn[data-variant="accent"]:hover { background: oklch(0.78 0.11 var(--accent-h)); border-color: oklch(0.74 0.11 var(--accent-h)); }
  .btn[data-variant="ghost"] { background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn[data-variant="ghost"]:hover { background: var(--surface-2); color: var(--ink); }
  .btn[data-variant="danger"] { color: oklch(0.50 0.16 25); }
  .btn[data-variant="danger"]:hover { background: oklch(0.50 0.16 25 / 0.08); border-color: oklch(0.50 0.16 25 / 0.30); }
  .btn[data-size="sm"] { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn[data-size="icon"] { padding: 7px; border-radius: 8px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ====== Inputs ====== */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field-label { font-size: 12px; font-weight: 500; color: var(--ink-2); letter-spacing: 0.01em; }
  .field-hint { font-size: 11px; color: var(--muted); }
  .field-error { font-size: 11px; color: oklch(0.55 0.20 25); }
  .input, .textarea, .select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    outline: none;
    width: 100%;
    font-size: 13.5px;
  }
  .input:hover, .textarea:hover, .select:hover { border-color: var(--border-strong); }
  .input:focus, .textarea:focus, .select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--ring);
    background: var(--surface);
  }
  .textarea { resize: vertical; min-height: 90px; line-height: 1.55; font-family: inherit; }
  .select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 5px 5px;
    background-repeat: no-repeat;
    padding-right: 30px;
  }

  /* Toggle */
  .toggle {
    --w: 36px; --h: 20px;
    position: relative; display: inline-flex; align-items: center;
    width: var(--w); height: var(--h);
    background: var(--border-strong);
    border-radius: 999px; cursor: pointer;
    transition: background .15s ease;
  }
  .toggle[data-on="true"] { background: var(--accent); }
  .toggle-thumb {
    position: absolute; left: 2px; top: 2px;
    width: calc(var(--h) - 4px); height: calc(var(--h) - 4px);
    background: white; border-radius: 999px;
    transition: transform .18s cubic-bezier(.4,1.4,.5,1);
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .toggle[data-on="true"] .toggle-thumb { transform: translateX(calc(var(--w) - var(--h))); }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }
  .card-hover { transition: box-shadow .2s ease, transform .15s ease, border-color .15s ease; }
  .card-hover:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); transform: translateY(-1px); }

  /* Badge */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 11px; font-weight: 500; color: var(--ink-2);
    line-height: 1.4;
  }
  .badge[data-tone="accent"] { background: var(--accent-tint); border-color: transparent; color: var(--accent-strong); }
  .badge[data-tone="success"] {
    background: oklch(0.93 0.05 165 / 0.7);
    color: oklch(0.40 0.10 165);
    border-color: transparent;
  }

  /* Skeleton */
  .skel {
    background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%);
    background-size: 400px 100%;
    animation: rk-shimmer 1.4s linear infinite;
    border-radius: 8px;
  }

  /* Toast */
  .toast-stack {
    position: fixed; bottom: 16px; right: 16px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 80; pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 10px;
    min-width: 260px; max-width: 360px;
    animation: rk-pop .25s cubic-bezier(.22,1.2,.36,1) both;
  }
  .toast[data-tone="success"] .toast-dot { background: oklch(0.55 0.16 150); }
  .toast[data-tone="error"] .toast-dot { background: oklch(0.55 0.20 25); }
  .toast[data-tone="info"] .toast-dot { background: var(--accent); }
  .toast-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }

  /* Avatar */
  .avatar {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px;
    font-weight: 600;
    font-family: var(--font-display);
    letter-spacing: -0.02em;
    color: oklch(0.98 0.01 var(--avh, 62));
    background: linear-gradient(135deg, oklch(0.62 0.10 var(--avh, 62)), oklch(0.46 0.12 var(--avh, 62)));
    flex-shrink: 0;
    user-select: none;
    overflow: hidden;
    box-shadow: 0 0 0 1px oklch(0.30 0.05 var(--avh, 62) / 0.10) inset;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* Section header */
  .section-head {
    display: flex; align-items: center; gap: 10px; padding: 16px 20px;
    cursor: pointer; user-select: none;
  }
  .section-chev { transition: transform .2s ease; color: var(--muted); }
  .section-head[data-open="true"] .section-chev { transform: rotate(90deg); }

  /* Chip */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 12.5px; color: var(--ink); font-weight: 500;
    transition: all .15s ease;
  }
  .chip:hover { border-color: var(--accent); background: var(--accent-tint); }
  .chip[data-dragging="true"] { opacity: 0.4; }
  .chip-drag { color: var(--faint); cursor: grab; display: inline-flex; }
  .chip-drag:active { cursor: grabbing; }
  .chip-x { display: inline-flex; padding: 2px; margin-right: -4px; border-radius: 99px; cursor: pointer; color: var(--muted); }
  .chip-x:hover { background: var(--border); color: var(--ink); }

  /* Editor layout */
  .split {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 0;
    flex: 1;
    min-height: 0;
  }
  @media (max-width: 1100px) {
    .split { grid-template-columns: 1fr; }
    .preview-pane { display: none; }
  }

  /* ─────────── Mobile (≤ 720px) ─────────── */
  @media (max-width: 720px) {
    body { font-size: 13.5px; }

    .topnav-inner { padding: 10px 14px; gap: 8px; flex-wrap: nowrap; }
    .logo { font-size: 15px; gap: 8px; }
    .logo-mark { width: 28px; height: 28px; }
    .topnav .select { display: none; } /* hide region/industry filters on small screens */

    .editor-pane { padding: 16px 14px 80px; }
    .preview-pane { padding: 20px 12px; }

    .rk-subheader-inner { padding: 10px 14px !important; gap: 8px !important; }
    .hide-mobile { display: none !important; }

    .section { border-radius: 12px; margin-bottom: 12px; }
    .section-head { padding: 14px 16px; }
    .section-body { padding: 4px 16px 18px; }

    /* form rows collapse to single column */
    .grid-2 { grid-template-columns: 1fr !important; }

    .card { border-radius: 12px; }
    .resume-doc {
      padding: 32px 24px 40px;
      font-size: 12px;
      max-width: 100%;
    }
    .resume-name { font-size: 28px; }
    .resume-section-title { margin-top: 28px; }

    .btn[data-size="sm"] { padding: 7px 10px; font-size: 12.5px; }

    .toast-stack { right: 12px; left: 12px; bottom: 12px; }
    .toast { min-width: 0; width: 100%; }

    h1[data-page-title] { font-size: 30px !important; }
  }

  /* On any narrow viewport, two-column form grids collapse */
  @media (max-width: 560px) {
    .grid-2 { grid-template-columns: 1fr !important; }
  }

  .editor-pane { overflow-y: auto; padding: 24px 28px 80px; background: var(--bg); }
  .preview-pane {
    overflow-y: auto; padding: 32px 24px;
    background: var(--surface-2);
    border-left: 1px solid var(--hairline);
  }

  /* Resume document */
  .resume-doc {
    background: var(--paper);
    color: oklch(0.22 0.045 255);
    border-radius: 4px;
    box-shadow:
      0 1px 2px oklch(0.20 0.04 255 / 0.06),
      0 24px 64px -24px oklch(0.20 0.04 255 / 0.30),
      0 6px 18px -8px oklch(0.20 0.04 255 / 0.14);
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 64px 80px;
    font-size: 12.5px;
    line-height: 1.62;
    border: 1px solid oklch(0.90 0.015 70);
    position: relative;
  }

  .resume-name {
    font-family: var(--font-display);
    font-size: 36px; font-weight: 600; letter-spacing: -0.03em;
    margin: 0 0 6px;
    color: oklch(0.20 0.045 255);
    line-height: 1.05;
    text-transform: none;
  }
  .resume-meta { color: oklch(0.45 0.030 255); font-size: 12px; letter-spacing: 0.01em; }
  .resume-section-title {
    font-family: var(--font-body);
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.20em;
    text-transform: uppercase; color: var(--accent-strong);
    margin: 36px 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid oklch(0.88 0.020 70);
    position: relative;
  }
  .resume-section-title::after {
    /* tiny bronze tick before the rule */
    content: "";
    position: absolute;
    bottom: -1px; left: 0;
    width: 28px; height: 1.5px;
    background: var(--accent);
  }
  .resume-summary { color: oklch(0.30 0.030 255); font-size: 12.5px; line-height: 1.75; max-width: 58ch; }

  .resume-timeline { position: relative; padding-left: 18px; }
  .resume-timeline::before {
    content: ""; position: absolute; left: 3px; top: 6px; bottom: 6px;
    width: 1px; background: oklch(0.88 0.018 70);
  }
  .resume-tl-item { position: relative; margin-bottom: 20px; }
  .resume-tl-item::before {
    content: ""; position: absolute; left: -19px; top: 6px;
    width: 9px; height: 9px; border-radius: 99px;
    background: var(--paper);
    border: 1.5px solid var(--accent);
  }

  .resume-tl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .resume-tl-title { font-weight: 600; color: oklch(0.22 0.045 255); font-size: 13px; }
  .resume-tl-org { color: oklch(0.42 0.030 255); font-size: 12px; font-style: italic; }
  .resume-tl-date {
    color: var(--accent-deep);
    font-size: 10.5px; font-variant-numeric: tabular-nums; white-space: nowrap;
    letter-spacing: 0.04em; text-transform: uppercase;
  }

  .resume-skills-group { margin-bottom: 16px; }
  .resume-skills-label {
    font-size: 9.5px; color: oklch(0.45 0.040 255); margin-bottom: 8px;
    font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
  }
  .resume-skill-chip {
    display: inline-flex; padding: 3px 10px; border-radius: 999px;
    background: oklch(0.97 0.015 70); border: 1px solid oklch(0.90 0.020 70);
    color: oklch(0.30 0.040 255); font-size: 11.5px; font-weight: 500;
    margin: 0 4px 4px 0;
  }

  .resume-contact-row {
    display: flex; flex-wrap: wrap; gap: 10px 18px;
    color: oklch(0.42 0.030 255); font-size: 11.5px;
    margin-top: 12px;
  }
  .resume-contact-row a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .resume-contact-row a:hover { color: var(--accent-strong); }

  /* Hairline divider */
  .hr { border: none; border-top: 1px solid var(--border); margin: 0; }

  /* Popover */
  .pop {
    position: absolute; z-index: 50;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-lg);
    padding: 12px;
    min-width: 200px;
    animation: rk-pop .15s ease both;
  }

  /* Focus ring helper */
  .focusable:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 8px;
  }

  /* Tabs */
  .tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
  .tab {
    padding: 6px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500;
    color: var(--muted); cursor: pointer; transition: all .15s ease;
    background: transparent; border: none;
  }
  .tab[data-active="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

  /* Print */
  @media print {
    body { background: white; }
    .no-print { display: none !important; }
    .resume-doc { box-shadow: none; border: none; max-width: 100%; padding: 0; margin: 0; }
    .resume-doc::before { display: none; }
  }

  /* Misc */
  .stack { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; }
  .spacer { flex: 1; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* Header (nav) */
  .topnav {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in oklab, var(--bg), transparent 25%);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--hairline);
  }
  .topnav-inner { max-width: 1400px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }

  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-display);
    font-weight: 600; letter-spacing: -0.02em; font-size: 17px;
    color: var(--ink);
    text-decoration: none;
  }
  .logo-mark {
    width: 32px; height: 32px;
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    position: relative;
    background: var(--accent-strong);
    color: var(--paper);
    box-shadow:
      inset 0 0 0 1px oklch(0.40 0.10 var(--accent-h) / 0.4),
      0 1px 2px oklch(0.20 0.04 255 / 0.16);
  }
  .logo-mark svg { display: block; }
  .logo-name { color: var(--ink); }
  .logo-name em { font-style: normal; font-weight: 400; color: var(--accent-deep); }

  /* Section card */
  .section {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
    margin-bottom: 16px;
    position: relative;
    box-shadow: var(--shadow-xs);
  }
  .section-body { padding: 4px 22px 22px; }
  .section-head {
    padding: 18px 22px;
  }

  /* Subtle inline link/button (used in lists) */
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted); cursor: pointer;
    transition: all .15s ease;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--border); }
  .icon-btn[data-tone="danger"]:hover { color: oklch(0.50 0.16 25); border-color: oklch(0.50 0.16 25 / 0.30); background: oklch(0.50 0.16 25 / 0.06); }

  /* Wizard progress */
  .progress-track { height: 3px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s cubic-bezier(.22,1,.36,1); }
  .step-bullet {
    width: 22px; height: 22px; border-radius: 99px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border-strong);
    color: var(--muted); font-size: 11px; font-weight: 600;
    transition: all .25s ease;
    font-family: var(--font-body);
  }
  .step-bullet[data-state="current"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .step-bullet[data-state="done"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* Pulsing save dot */
  .savedot {
    width: 6px; height: 6px; border-radius: 99px;
    background: var(--faint);
  }
  .savedot[data-state="saving"] { background: oklch(0.7 0.13 70); animation: rk-pulse-ring 1.2s ease infinite; }
  .savedot[data-state="saved"] { background: oklch(0.55 0.16 150); }
  .savedot[data-state="error"] { background: oklch(0.55 0.20 25); }

  /* Editor sub-header — has its own className so mobile-rule can squish padding */
  .rk-subheader-inner { padding: 12px 28px; }
</style>
